[package]
name = "omnisocials"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust SDK for the OmniSocials API. Schedule and publish social media posts across 11 platforms."
license = "MIT"
repository = "https://github.com/OmniSocials/omnisocials-rust"
homepage = "https://docs.omnisocials.com"
documentation = "https://docs.rs/omnisocials"
readme = "README.md"
keywords = ["omnisocials", "social-media", "api", "sdk", "scheduling"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
